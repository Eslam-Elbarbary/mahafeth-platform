# Mahafeth — Nginx site config (see docs/production-deployment.md, section 12).
#
#   Internet ─ 443 ─▶ Nginx ─┬─ mahafeth.com        /           ─▶ Next.js   127.0.0.1:3000
#                            │                      /api/v1/    ─▶ Backend   127.0.0.1:4000
#                            │                      /uploads/   ─▶ Backend   127.0.0.1:4000
#                            └─ admin.mahafeth.com  /           ─▶ static apps/admin/dist (SPA)
#                                                   /api/       ─▶ Backend   127.0.0.1:4000
#                                                   /uploads/   ─▶ Backend   127.0.0.1:4000
#
# Before installing, replace:
#   mahafeth.com / admin.mahafeth.com   → the real domains
#   /srv/mahafeth/current               → the release directory
# Install: /etc/nginx/sites-available/mahafeth.conf (symlinked into sites-enabled), then
#   sudo nginx -t && sudo systemctl reload nginx
#
# The backend runs with TRUST_PROXY=loopback: Nginx is on the same host and replaces
# X-Forwarded-For with the connecting address, so clients cannot spoof their IP for rate limits
# or the audit log. If a load balancer/CDN is added in front of Nginx, revisit TRUST_PROXY and
# the real_ip settings together.

upstream mahafeth_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream mahafeth_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# WebSocket-ready: upgrade when asked, otherwise clear Connection so upstream keepalive works.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ── HTTP: ACME challenges, everything else to HTTPS ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mahafeth.com www.mahafeth.com admin.mahafeth.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www → apex ───────────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mahafeth.com;

    ssl_certificate     /etc/letsencrypt/live/mahafeth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahafeth.com/privkey.pem;

    return 301 https://mahafeth.com$request_uri;
}

# ── Website ──────────────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mahafeth.com;

    ssl_certificate     /etc/letsencrypt/live/mahafeth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahafeth.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MahafethSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # The website only posts small JSON (the interest form).
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 60s;
    # Nginx owns HSTS; the backend sends it too in production.
    proxy_hide_header Strict-Transport-Security;

    # The backend calls Next directly on 127.0.0.1:3000; never reachable from the internet.
    location = /api/revalidate {
        return 404;
    }

    location /api/v1/ {
        proxy_pass http://mahafeth_api;
    }

    # CMS media. The backend sets long-lived immutable caching and nosniff (file names are UUIDs).
    location /uploads/ {
        proxy_pass http://mahafeth_api;
        # Upstream headers apply as-is; repeat HSTS because add_header here would not inherit.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /health {
        proxy_pass http://mahafeth_api;
        access_log off;
    }

    location / {
        proxy_pass http://mahafeth_web;
    }
}

# ── Admin (static SPA) ───────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.mahafeth.com;

    ssl_certificate     /etc/letsencrypt/live/admin.mahafeth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mahafeth.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MahafethSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    root /srv/mahafeth/current/apps/admin/dist;
    index index.html;

    # Media uploads: MAX_UPLOAD_MB (20) plus multipart overhead.
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_hide_header Strict-Transport-Security;

    location /api/ {
        proxy_pass http://mahafeth_api;
        # Uploads stream straight to the backend instead of being buffered to disk first.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://mahafeth_api;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Hashed build assets never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback: deep links such as /settings/content load index.html; React Router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so a new release is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
